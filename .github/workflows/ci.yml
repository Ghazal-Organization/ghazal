name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend:
        name: Frontend build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - uses: pnpm/action-setup@v4
              with:
                version: 10
                run_install: false
            
            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'pnpm'
            
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter customer-web build
            - run: pnpm --filter admin-web build
            - run: pnpm --filter e2e exec playwright install --with-deps chromium
    backend:
        name: Backend build & test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-dotnet@v3
              with:
                global-json-file: global.json
            - run: dotnet restore Ghazal.slnx
            - run: dotnet build Ghazal.slnx --no-restore --configuration Release
            - run: dotnet test Ghazal.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                name: dotnet-test-results
                path: '**/test-results.trx'
                retention-days: 7

