name: Deploy customer-web

on:
  push:
    branches: [main]
    paths:
      - 'apps/customer-web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-customer-web.yml'
      - '.github/workflows/_swa-deploy.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'apps/customer-web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-customer-web.yml'
      - '.github/workflows/_swa-deploy.yml'

concurrency:
  group: deploy-customer-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_swa-deploy.yml
    with:
      app_name: customer-web
      app_dir: apps/customer-web
    secrets:
      swa_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_OCEAN_0B45DA803 }}